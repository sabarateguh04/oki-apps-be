<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Perangkat — OKI Maintenance</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="content">
  <div id="topbar-slot"></div>

  <div class="page-body">
    <div class="card mb-3">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-md-3">
            <label class="form-label small text-muted">Cari (nama/SN)</label>
            <input class="form-control form-control-sm" id="f-search" placeholder="Ketik lalu Enter" onkeydown="if(event.key==='Enter')loadPerangkat()">
          </div>
          <div class="col-md-3">
            <label class="form-label small text-muted">Status</label>
            <select class="form-select form-select-sm" id="f-status" onchange="loadPerangkat()">
              <option value="">Semua Status</option>
              <option value="TERSEDIA">Tersedia</option>
              <option value="TERPAKAI">Terpakai</option>
              <option value="RUSAK">Rusak</option>
              <option value="MAINTENANCE">Maintenance</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label small text-muted">Kategori</label>
            <input class="form-control form-control-sm" id="f-kategori" placeholder="mis. Router" onkeydown="if(event.key==='Enter')loadPerangkat()">
          </div>
          <div class="col-md-3 text-end">
            <button class="btn btn-primary btn-sm w-100" onclick="openModal()"><i class="bi bi-plus-lg"></i> Tambah Perangkat</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><i class="bi bi-hdd-network"></i> Master Perangkat</div>
      <div class="card-body p-0">
        <table class="table mb-0">
          <thead><tr><th>Nama Perangkat</th><th>Kategori</th><th>Merk/Model</th><th>Serial Number</th><th>Status</th><th>Lokasi Terpasang</th><th class="text-end">Aksi</th></tr></thead>
          <tbody id="perangkat-body">
            <tr><td colspan="7"><div class="skeleton" style="height:18px;margin:8px 0;"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="perangkatModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content" style="border-radius:16px;">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">Tambah Perangkat</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="p-id">
        <div class="row">
          <div class="col-md-8 mb-3"><label class="form-label">Nama Perangkat *</label><input class="form-control" id="p-nama" placeholder="mis. Router Mikrotik RB750"></div>
          <div class="col-md-4 mb-3"><label class="form-label">Kategori</label><input class="form-control" id="p-kategori" placeholder="mis. Router" list="kategori-suggestions"><datalist id="kategori-suggestions"></datalist></div>
        </div>
        <div class="row">
          <div class="col-md-4 mb-3"><label class="form-label">Merk</label><input class="form-control" id="p-merk"></div>
          <div class="col-md-4 mb-3"><label class="form-label">Model</label><input class="form-control" id="p-model"></div>
          <div class="col-md-4 mb-3"><label class="form-label">Serial Number *</label><input class="form-control" id="p-sn" placeholder="Unik per unit"></div>
        </div>
        <div class="mb-3"><label class="form-label">Spesifikasi</label><textarea class="form-control" id="p-spek" rows="2"></textarea></div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" id="p-status">
              <option value="TERSEDIA">Tersedia (di gudang)</option>
              <option value="TERPAKAI">Terpakai</option>
              <option value="RUSAK">Rusak</option>
              <option value="MAINTENANCE">Maintenance</option>
            </select>
          </div>
          <div class="col-md-6 mb-3" id="site-select-wrap" style="display:none;">
            <label class="form-label">Lokasi Terpasang (Site)</label>
            <select class="form-select" id="p-site"><option value="">Pilih site...</option></select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
        <button class="btn btn-primary" onclick="savePerangkat()">Simpan</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
  const session = requireAuth(['staff']);
  let modal, perangkatList = [], allSites = [];

  const STATUS_LABEL = { TERSEDIA: 'Tersedia', TERPAKAI: 'Terpakai', RUSAK: 'Rusak', MAINTENANCE: 'Maintenance' };
  const STATUS_TONE = { TERSEDIA: 'badge-status-DONE', TERPAKAI: 'badge-priority-MEDIUM', RUSAK: 'badge-status-REJECTED', MAINTENANCE: 'badge-approval-PENDING' };

  if (session && session.role !== 'ADMIN') {
    document.body.innerHTML = '<div class="empty-state" style="margin:60px auto;"><i class="bi bi-shield-lock"></i><p>Master Perangkat hanya untuk role <b>Admin</b>.</p><a href="dashboard" class="btn btn-primary btn-sm">Kembali ke Dashboard</a></div>';
  } else if (session) {
    renderLayout({ active: 'perangkat', title: 'Master Perangkat' });
    loadPerangkat();
  }

  function statusBadgePerangkat(s) {
    return `<span class="badge ${STATUS_TONE[s] || ''}">${STATUS_LABEL[s] || s}</span>`;
  }

  async function loadPerangkat() {
    const body = document.getElementById('perangkat-body');
    const params = new URLSearchParams();
    const search = document.getElementById('f-search')?.value.trim();
    const status = document.getElementById('f-status')?.value;
    const kategori = document.getElementById('f-kategori')?.value.trim();
    if (search) params.set('search', search);
    if (status) params.set('status', status);
    if (kategori) params.set('kategori', kategori);
    try {
      const d = await api(`/api/perangkat?${params.toString()}`);
      perangkatList = d.perangkat;
      if (!perangkatList.length) {
        body.innerHTML = '<tr><td colspan="7"><div class="empty-state"><i class="bi bi-hdd-network"></i><p>Belum ada perangkat terdaftar</p></div></td></tr>';
        return;
      }
      body.innerHTML = perangkatList.map(p => `
        <tr>
          <td><b>${escapeHtml(p.nama_perangkat)}</b></td>
          <td class="text-muted small">${escapeHtml(p.kategori || '-')}</td>
          <td class="text-muted small">${escapeHtml([p.merk, p.model].filter(Boolean).join(' / ') || '-')}</td>
          <td><code>${escapeHtml(p.serial_number)}</code></td>
          <td>${statusBadgePerangkat(p.status)}</td>
          <td class="text-muted small">${p.site_name ? `${escapeHtml(p.site_name)} <span class="text-muted">(${escapeHtml(p.nama_perusahaan || '-')})</span>` : '-'}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-primary" onclick="openModal(${p.id})"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="deletePerangkat(${p.id})"><i class="bi bi-trash"></i></button>
          </td>
        </tr>`).join('');

      const cats = [...new Set(perangkatList.map(p => p.kategori).filter(Boolean))];
      const dl = document.getElementById('kategori-suggestions');
      if (dl) dl.innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">`).join('');
    } catch (e) {
      body.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">${e.message}</td></tr>`;
    }
  }

  async function ensureSitesLoaded() {
    if (allSites.length) return;
    try {
      const d = await api('/api/sites');
      allSites = d.sites;
    } catch (e) { /* diamkan, dropdown site cuma opsional */ }
  }

  async function openModal(id) {
    if (!modal) modal = new bootstrap.Modal(document.getElementById('perangkatModal'));
    await ensureSitesLoaded();
    const sel = document.getElementById('p-site');
    sel.innerHTML = '<option value="">Pilih site...</option>' + allSites.map(s => `<option value="${s.id}">${escapeHtml(s.site_name)} (${escapeHtml(s.nama_perusahaan)})</option>`).join('');

    const p = perangkatList.find(x => x.id === id) || {};
    document.getElementById('modal-title').textContent = id ? 'Edit Perangkat' : 'Tambah Perangkat';
    document.getElementById('p-id').value = id || '';
    document.getElementById('p-nama').value = p.nama_perangkat || '';
    document.getElementById('p-kategori').value = p.kategori || '';
    document.getElementById('p-merk').value = p.merk || '';
    document.getElementById('p-model').value = p.model || '';
    document.getElementById('p-sn').value = p.serial_number || '';
    document.getElementById('p-spek').value = p.spesifikasi || '';
    document.getElementById('p-status').value = p.status || 'TERSEDIA';
    document.getElementById('p-site').value = p.site_id || '';
    toggleSiteSelect();
    modal.show();
  }

  document.addEventListener('change', (e) => { if (e.target.id === 'p-status') toggleSiteSelect(); });
  function toggleSiteSelect() {
    const status = document.getElementById('p-status').value;
    document.getElementById('site-select-wrap').style.display = status === 'TERPAKAI' ? 'block' : 'none';
  }

  async function savePerangkat() {
    const id = document.getElementById('p-id').value;
    const status = document.getElementById('p-status').value;
    const payload = {
      nama_perangkat: document.getElementById('p-nama').value.trim(),
      kategori: document.getElementById('p-kategori').value.trim(),
      merk: document.getElementById('p-merk').value.trim(),
      model: document.getElementById('p-model').value.trim(),
      serial_number: document.getElementById('p-sn').value.trim(),
      spesifikasi: document.getElementById('p-spek').value.trim(),
      status,
      site_id: status === 'TERPAKAI' ? (document.getElementById('p-site').value || null) : null,
    };
    if (!payload.nama_perangkat || !payload.serial_number) { toast('Nama perangkat dan serial number wajib diisi', 'error'); return; }
    try {
      if (id) {
        await api(`/api/perangkat/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
      } else {
        await api('/api/perangkat', { method: 'POST', body: JSON.stringify(payload) });
      }
      toast('Perangkat berhasil disimpan', 'success');
      modal.hide();
      loadPerangkat();
    } catch (e) { toast(e.message, 'error'); }
  }

  async function deletePerangkat(id) {
    if (!confirm('Hapus perangkat ini dari master?')) return;
    try {
      await api(`/api/perangkat/${id}`, { method: 'DELETE' });
      toast('Perangkat dihapus', 'success');
      loadPerangkat();
    } catch (e) { toast(e.message, 'error'); }
  }
</script>
</body>
</html>
